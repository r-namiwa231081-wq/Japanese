<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>縦書き資料作文ワークシート</title>
  
  <!-- Noto Serif JP & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 縦書き基盤設定 */
    :root {
      --font-size: 17px;
      --line-h: 34px;
    }

    body {
      font-family: "BIZ UDMincho", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .tategaki {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: mixed;
      font-feature-settings: "palt" 0;
      font-size: var(--font-size);
      line-height: var(--line-h);
    }

    /* ズレない縦罫線（textareaに直接背景描画してスクロールと完全同期） */
    .grid-lines-on {
      background-image: repeating-linear-gradient(
        to left,
        rgba(148, 163, 184, 0.4) 0px,
        rgba(148, 163, 184, 0.4) 1px,
        transparent 1px,
        transparent var(--line-h)
      );
      background-position: right top;
      background-attachment: local;
      background-size: auto 100%;
    }

    /* 縦書きテキストエリア共通スタイリング */
    .vert-input {
      background-color: transparent;
      resize: none;
      outline: none;
      border: none;
      padding: 0;
      margin: 0;
      box-sizing: content-box;
      overflow-y: hidden;
      overflow-x: auto;
      letter-spacing: 0.05em;
    }

    .vert-input::placeholder {
      color: #94a3b8;
      font-weight: normal;
    }

    /* 印刷スタイル */
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }
      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-wrapper {
        padding: 0 !important;
        margin: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .a4-paper {
        box-shadow: none !important;
        border: none !important;
        width: 297mm !important;
        height: 210mm !important;
        padding: 12mm 15mm !important;
        margin: 0 !important;
      }
      /* 印刷時はtextareaを非表示にし、ミリ秒同期したdivで印刷 */
      .vert-input {
        display: none !important;
      }
      .print-mirror {
        display: block !important;
      }
      /* 印刷時に未入力枠や点線を綺麗に調整 */
      .empty-slot-print {
        border-color: transparent !important;
        background: transparent !important;
      }
      .placeholder-text-print {
        display: none !important;
      }
    }

    .print-mirror {
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
      overflow: hidden;
    }

    /* スクロールバーの非表示 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-700 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- ================= TOOLBAR (NO-PRINT) ================= -->
  <header class="no-print bg-slate-900 text-slate-100 shadow-md sticky top-0 z-30 font-sans text-xs border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
      
      <!-- Title -->
      <div class="flex items-center gap-2">
        <span class="bg-emerald-600 text-white px-2 py-0.5 rounded font-bold text-[11px]">国語</span>
        <h1 class="font-bold text-sm tracking-wide">縦書き資料作文ワークシート</h1>
      </div>

      <!-- Controls -->
      <div class="flex flex-wrap items-center gap-3">
        
        <!-- Layout Selection -->
        <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">
          <span class="text-slate-400 font-medium">配置:</span>
          <select id="layoutSelect" onchange="setLayout(this.value)" class="bg-slate-700 text-white rounded px-2 py-0.5 outline-none border border-slate-600 cursor-pointer">
            <option value="left1">左に資料 (1つ)</option>
            <option value="left2" selected>左に資料 (2つ)</option>
            <option value="bottom2">下に資料 (2つ)</option>
            <option value="split">左右文章 / 中央資料</option>
          </select>
        </div>

        <!-- Font Size Selection -->
        <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">
          <span class="text-slate-400 font-medium">文字:</span>
          <select id="fontSizeSelect" onchange="setFontSize(this.value)" class="bg-slate-700 text-white rounded px-2 py-0.5 outline-none border border-slate-600 cursor-pointer">
            <option value="sm">小 (14px / 28px行幅)</option>
            <option value="md" selected>中 (17px / 34px行幅)</option>
            <option value="lg">大 (20px / 40px行幅)</option>
          </select>
        </div>

        <!-- Grid Lines Toggle -->
        <label class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
          <input type="checkbox" id="linesToggle" onchange="toggleLines(this.checked)" checked class="rounded accent-emerald-500">
          <span class="text-slate-300">縦罫線</span>
        </label>

        <!-- Counter -->
        <div class="bg-slate-800 px-3 py-1 rounded border border-slate-700 font-mono text-slate-300">
          本文: <span id="charCount" class="font-bold text-emerald-400">0</span> 字
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2 ml-2">
          <button onclick="clearAll()" title="白紙に戻す" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1 rounded transition flex items-center gap-1">
            <span>🗑️</span> リセット
          </button>
          <button onclick="window.print()" title="A4横向き印刷・PDF保存" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-1 rounded shadow transition flex items-center gap-1">
            <span>🖨️</span> 印刷 / PDF
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ================= MAIN PAPER CONTAINER ================= -->
  <main class="flex-1 flex justify-center items-center p-4 sm:p-8 print-wrapper overflow-auto">
    
    <!-- A4 Landscape Sheet (Fixed 297mm x 210mm Ratio) -->
    <div id="paper" class="a4-paper bg-white shadow-2xl rounded-sm relative flex flex-col justify-between transition-all duration-200" style="width: 1000px; height: 707px; padding: 40px 48px;">
      
      <!-- Dynamic Content Layout -->
      <div id="paperContent" class="w-full h-full flex flex-row-reverse gap-6">
        <!-- JS will render layout here -->
      </div>

    </div>

  </main>

  <!-- Hidden File Input for Image Upload -->
  <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageFile(event)">

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // System State
    const state = {
      layout: 'left2', 
      fontSize: 'md', 
      showLines: true,
      title: '',
      author: '',
      body1: '',
      body2: '',
      materials: [
        { title: '資料①', image: '' },
        { title: '資料②', image: '' }
      ]
    };

    // Font Spec: Exact Integer Pixels for 100% Alignment
    const fontSpecs = {
      sm: { size: 14, line: 28 },
      md: { size: 17, line: 34 },
      lg: { size: 20, line: 40 }
    };

    let activeMaterialIndex = null;
    let resizeObserver = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      setupPasteListener();
      updateCSSVariables();
      render();

      // Window resize handler
      window.addEventListener('resize', () => {
        snapTextareaWidths();
      });
    });

    function updateCSSVariables() {
      const spec = fontSpecs[state.fontSize] || fontSpecs.md;
      document.documentElement.style.setProperty('--font-size', `${spec.size}px`);
      document.documentElement.style.setProperty('--line-h', `${spec.line}px`);
    }

    // Main Layout Renderer
    function render() {
      updateCSSVariables();
      const container = document.getElementById('paperContent');
      container.innerHTML = '';

      const lineClass = state.showLines ? 'grid-lines-on' : '';
      const lineH = fontSpecs[state.fontSize].line;

      // -----------------------------------------------------------------
      // LAYOUT 1: LEFT 1 MATERIAL (右本文 + 左資料1つ)
      // -----------------------------------------------------------------
      if (state.layout === 'left1') {
        container.className = "w-full h-full flex flex-row-reverse gap-6";
        container.innerHTML = `
          <!-- 本文エリア（縦書き） -->
          <div class="flex-1 h-full flex flex-row-reverse tategaki overflow-hidden">
            <!-- 題名欄（1行固定） -->
            <div class="h-full shrink-0 relative" style="width: ${lineH}px;">
              <textarea id="txtTitle" class="vert-input ${lineClass} h-full text-center font-bold" style="width: ${lineH}px;" placeholder="題名" oninput="onTextChange()">${escapeHTML(state.title)}</textarea>
              <div id="mirrorTitle" class="print-mirror tategaki h-full text-center font-bold" style="width: ${lineH}px;"></div>
            </div>
            <!-- 名前欄（1行固定） -->
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: ${lineH}px;">
              <textarea id="txtAuthor" class="vert-input ${lineClass} h-full text-right text-slate-700" style="width: ${lineH}px;" placeholder="〇年〇組 名前" oninput="onTextChange()">${escapeHTML(state.author)}</textarea>
              <div id="mirrorAuthor" class="print-mirror tategaki h-full text-right text-slate-700" style="width: ${lineH}px;"></div>
            </div>
            <!-- 本文欄（可変スナップ幅） -->
            <div id="bodyBox1" class="h-full flex-1 relative overflow-hidden pl-2">
              <textarea id="txtBody1" class="vert-input ${lineClass} h-full w-full" placeholder="ここから縦書きで文章を入力します…" oninput="onTextChange()">${escapeHTML(state.body1)}</textarea>
              <div id="mirrorBody1" class="print-mirror tategaki h-full w-full"></div>
            </div>
          </div>

          <!-- 資料エリア（左側1つ） -->
          <div class="w-2/5 h-full flex flex-col horizontal-tb border-r border-slate-200 pr-6">
            ${renderMaterialSlot(0, 'h-full')}
          </div>
        `;
      }

      // -----------------------------------------------------------------
      // LAYOUT 2: LEFT 2 MATERIALS (右本文 + 左資料2つ上下)
      // -----------------------------------------------------------------
      else if (state.layout === 'left2') {
        container.className = "w-full h-full flex flex-row-reverse gap-6";
        container.innerHTML = `
          <!-- 本文エリア（縦書き） -->
          <div class="flex-1 h-full flex flex-row-reverse tategaki overflow-hidden">
            <div class="h-full shrink-0 relative" style="width: ${lineH}px;">
              <textarea id="txtTitle" class="vert-input ${lineClass} h-full text-center font-bold" style="width: ${lineH}px;" placeholder="題名" oninput="onTextChange()">${escapeHTML(state.title)}</textarea>
              <div id="mirrorTitle" class="print-mirror tategaki h-full text-center font-bold" style="width: ${lineH}px;"></div>
            </div>
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: ${lineH}px;">
              <textarea id="txtAuthor" class="vert-input ${lineClass} h-full text-right text-slate-700" style="width: ${lineH}px;" placeholder="〇年〇組 名前" oninput="onTextChange()">${escapeHTML(state.author)}</textarea>
              <div id="mirrorAuthor" class="print-mirror tategaki h-full text-right text-slate-700" style="width: ${lineH}px;"></div>
            </div>
            <div id="bodyBox1" class="h-full flex-1 relative overflow-hidden pl-2">
              <textarea id="txtBody1" class="vert-input ${lineClass} h-full w-full" placeholder="ここから縦書きで文章を入力します…" oninput="onTextChange()">${escapeHTML(state.body1)}</textarea>
              <div id="mirrorBody1" class="print-mirror tategaki h-full w-full"></div>
            </div>
          </div>

          <!-- 資料エリア（左側2つ上下） -->
          <div class="w-2/5 h-full flex flex-col gap-4 horizontal-tb border-r border-slate-200 pr-6">
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(0, 'h-full')}</div>
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(1, 'h-full')}</div>
          </div>
        `;
      }

      // -----------------------------------------------------------------
      // LAYOUT 3: BOTTOM 2 MATERIALS (上本文 + 下資料2つ左右)
      // -----------------------------------------------------------------
      else if (state.layout === 'bottom2') {
        container.className = "w-full h-full flex flex-col justify-between gap-4";
        container.innerHTML = `
          <!-- 本文エリア（縦書き） -->
          <div class="flex-1 w-full flex flex-row-reverse tategaki overflow-hidden pb-2">
            <div class="h-full shrink-0 relative" style="width: ${lineH}px;">
              <textarea id="txtTitle" class="vert-input ${lineClass} h-full text-center font-bold" style="width: ${lineH}px;" placeholder="題名" oninput="onTextChange()">${escapeHTML(state.title)}</textarea>
              <div id="mirrorTitle" class="print-mirror tategaki h-full text-center font-bold" style="width: ${lineH}px;"></div>
            </div>
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: ${lineH}px;">
              <textarea id="txtAuthor" class="vert-input ${lineClass} h-full text-right text-slate-700" style="width: ${lineH}px;" placeholder="〇年〇組 名前" oninput="onTextChange()">${escapeHTML(state.author)}</textarea>
              <div id="mirrorAuthor" class="print-mirror tategaki h-full text-right text-slate-700" style="width: ${lineH}px;"></div>
            </div>
            <div id="bodyBox1" class="h-full flex-1 relative overflow-hidden pl-2">
              <textarea id="txtBody1" class="vert-input ${lineClass} h-full w-full" placeholder="ここから縦書きで文章を入力します…" oninput="onTextChange()">${escapeHTML(state.body1)}</textarea>
              <div id="mirrorBody1" class="print-mirror tategaki h-full w-full"></div>
            </div>
          </div>

          <!-- 資料エリア（下側2つ左右） -->
          <div class="h-52 grid grid-cols-2 gap-4 horizontal-tb pt-3 border-t border-slate-200 shrink-0">
            ${renderMaterialSlot(0, 'h-full')}
            ${renderMaterialSlot(1, 'h-full')}
          </div>
        `;
      }

      // -----------------------------------------------------------------
      // LAYOUT 4: SPLIT (右文章前半 + 中央資料 + 左文章後半)
      // -----------------------------------------------------------------
      else if (state.layout === 'split') {
        container.className = "w-full h-full flex flex-row-reverse gap-4";
        container.innerHTML = `
          <!-- 右本文エリア -->
          <div class="flex-1 h-full flex flex-row-reverse tategaki overflow-hidden">
            <div class="h-full shrink-0 relative" style="width: ${lineH}px;">
              <textarea id="txtTitle" class="vert-input ${lineClass} h-full text-center font-bold" style="width: ${lineH}px;" placeholder="題名" oninput="onTextChange()">${escapeHTML(state.title)}</textarea>
              <div id="mirrorTitle" class="print-mirror tategaki h-full text-center font-bold" style="width: ${lineH}px;"></div>
            </div>
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: ${lineH}px;">
              <textarea id="txtAuthor" class="vert-input ${lineClass} h-full text-right text-slate-700" style="width: ${lineH}px;" placeholder="〇年〇組 名前" oninput="onTextChange()">${escapeHTML(state.author)}</textarea>
              <div id="mirrorAuthor" class="print-mirror tategaki h-full text-right text-slate-700" style="width: ${lineH}px;"></div>
            </div>
            <div id="bodyBox1" class="h-full flex-1 relative overflow-hidden pl-2">
              <textarea id="txtBody1" class="vert-input ${lineClass} h-full w-full" placeholder="文章（前半）を入力…" oninput="onTextChange()">${escapeHTML(state.body1)}</textarea>
              <div id="mirrorBody1" class="print-mirror tategaki h-full w-full"></div>
            </div>
          </div>

          <!-- 中央資料エリア -->
          <div class="w-1/3 h-full flex flex-col gap-3 horizontal-tb px-3 border-x border-slate-200">
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(0, 'h-full')}</div>
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(1, 'h-full')}</div>
          </div>

          <!-- 左本文エリア（後半） -->
          <div class="flex-1 h-full flex flex-row-reverse tategaki overflow-hidden">
            <div id="bodyBox2" class="h-full flex-1 relative overflow-hidden pl-2">
              <textarea id="txtBody2" class="vert-input ${lineClass} h-full w-full" placeholder="文章（後半・まとめ）を入力…" oninput="onTextChange()">${escapeHTML(state.body2)}</textarea>
              <div id="mirrorBody2" class="print-mirror tategaki h-full w-full"></div>
            </div>
          </div>
        `;
      }

      // Synchronize text & widths
      syncMirrors();
      snapTextareaWidths();
      updateCharCount();
    }

    // Material Component Builder
    function renderMaterialSlot(index, heightClass = '') {
      const mat = state.materials[index] || { title: `資料${index+1}`, image: '' };
      const hasImage = !!mat.image;

      return `
        <div class="w-full ${heightClass} flex flex-col justify-between border border-slate-300 rounded p-2 bg-slate-50/50 relative group ${!hasImage ? 'empty-slot-print' : ''}">
          
          <!-- Image Container -->
          <div 
            onclick="triggerFileInput(${index})"
            ondragover="handleDragOver(event)"
            ondrop="handleDrop(event, ${index})"
            class="flex-1 border-2 border-dashed ${hasImage ? 'border-transparent bg-white' : 'border-slate-300 hover:border-slate-400 bg-white/60'} rounded flex items-center justify-center overflow-hidden cursor-pointer relative transition"
          >
            ${hasImage ? `
              <img src="${mat.image}" class="w-full h-full object-contain" alt="${escapeHTML(mat.title)}">
              
              <!-- Hover Remove Button (No Print) -->
              <button 
                onclick="event.stopPropagation(); removeImage(${index})" 
                title="画像を削除" 
                class="no-print absolute top-1.5 right-1.5 opacity-0 group-hover:opacity-100 transition bg-slate-900/80 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold z-10 shadow"
              >
                ✕
              </button>
            ` : `
              <div class="text-center p-2 select-none placeholder-text-print">
                <div class="text-xl text-slate-400 mb-0.5">📷</div>
                <p class="text-xs font-bold text-slate-500">クリック / ドロップで画像挿入</p>
                <p class="text-[10px] text-slate-400 mt-0.5">（Ctrl+V で貼り付けも可能）</p>
              </div>
            `}
          </div>

          <!-- Title Input -->
          <div class="mt-1.5 shrink-0 flex items-center border-t border-slate-200/60 pt-1">
            <input 
              type="text" 
              value="${escapeHTML(mat.title)}" 
              oninput="updateMaterialTitle(${index}, this.value)" 
              placeholder="資料タイトル" 
              class="w-full bg-transparent font-bold text-xs text-slate-700 outline-none text-center placeholder:text-slate-400 placeholder:font-normal"
            >
          </div>

        </div>
      `;
    }

    // Precise Width Snapping to Prevent Grid Sub-pixel Drift
    function snapTextareaWidths() {
      const lineH = fontSpecs[state.fontSize].line;
      ['bodyBox1', 'bodyBox2'].forEach(boxId => {
        const box = document.getElementById(boxId);
        if (!box) return;
        const ta = box.querySelector('textarea');
        const mirror = box.querySelector('.print-mirror');
        if (!ta) return;

        const availableW = box.clientWidth;
        const snappedW = Math.max(lineH, Math.floor(availableW / lineH) * lineH);
        
        ta.style.width = `${snappedW}px`;
        if (mirror) mirror.style.width = `${snappedW}px`;
      });
    }

    // Text Sync between Textarea and Print Mirror
    function onTextChange() {
      const elTitle = document.getElementById('txtTitle');
      const elAuthor = document.getElementById('txtAuthor');
      const elBody1 = document.getElementById('txtBody1');
      const elBody2 = document.getElementById('txtBody2');

      if (elTitle) state.title = elTitle.value;
      if (elAuthor) state.author = elAuthor.value;
      if (elBody1) state.body1 = elBody1.value;
      if (elBody2) state.body2 = elBody2.value;

      syncMirrors();
      updateCharCount();
      saveState();
    }

    function syncMirrors() {
      const mTitle = document.getElementById('mirrorTitle');
      const mAuthor = document.getElementById('mirrorAuthor');
      const mBody1 = document.getElementById('mirrorBody1');
      const mBody2 = document.getElementById('mirrorBody2');

      if (mTitle) mTitle.textContent = state.title;
      if (mAuthor) mAuthor.textContent = state.author;
      if (mBody1) mBody1.textContent = state.body1;
      if (mBody2) mBody2.textContent = state.body2;
    }

    function updateCharCount() {
      const count1 = (state.body1 || '').replace(/\s/g, '').length;
      const count2 = (state.body2 || '').replace(/\s/g, '').length;
      document.getElementById('charCount').innerText = count1 + count2;
    }

    // Image Upload Handlers
    function triggerFileInput(index) {
      activeMaterialIndex = index;
      document.getElementById('imageInput').click();
    }

    function handleImageFile(e) {
      const file = e.target.files[0];
      if (file && activeMaterialIndex !== null) {
        processImageFile(file, activeMaterialIndex);
      }
      e.target.value = '';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    function handleDrop(e, index) {
      e.preventDefault();
      e.stopPropagation();
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        processImageFile(files[0], index);
      }
    }

    function setupPasteListener() {
      window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
          if (item.type.indexOf('image') !== -1) {
            const file = item.getAsFile();
            let targetIdx = state.materials.findIndex(m => !m.image);
            if (targetIdx === -1) targetIdx = 0;
            processImageFile(file, targetIdx);
            break;
          }
        }
      });
    }

    function processImageFile(file, index) {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        state.materials[index].image = evt.target.result;
        saveState();
        render();
      };
      reader.readAsDataURL(file);
    }

    function updateMaterialTitle(index, val) {
      state.materials[index].title = val;
      saveState();
    }

    function removeImage(index) {
      state.materials[index].image = '';
      saveState();
      render();
    }

    // Controls
    function setLayout(val) {
      state.layout = val;
      saveState();
      render();
    }

    function setFontSize(val) {
      state.fontSize = val;
      saveState();
      render();
    }

    function toggleLines(checked) {
      state.showLines = checked;
      saveState();
      render();
    }

    function clearAll() {
      if (confirm('入力した文章と資料を消して、白紙に戻しますか？')) {
        state.title = '';
        state.author = '';
        state.body1 = '';
        state.body2 = '';
        state.materials = [
          { title: '資料①', image: '' },
          { title: '資料②', image: '' }
        ];
        saveState();
        render();
      }
    }

    // Storage
    function saveState() {
      try {
        localStorage.setItem('tategaki_perfect_sheet_state', JSON.stringify(state));
      } catch (err) {
        console.warn('LocalStorage save limit reached.', err);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('tategaki_perfect_sheet_state');
        if (saved) {
          const parsed = JSON.parse(saved);
          Object.assign(state, parsed);
          document.getElementById('layoutSelect').value = state.layout || 'left2';
          document.getElementById('fontSizeSelect').value = state.fontSize || 'md';
          document.getElementById('linesToggle').checked = state.showLines !== false;
        }
      } catch (err) {
        console.warn('LocalStorage load error:', err);
      }
    }

    // Helper
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>

</body>
</html>
