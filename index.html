<!DOCTYPE html>
<html lang="ja"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>縦書き資料作文ワークシート</title>
  
  <!-- Google Fonts: Noto Serif JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&amp;display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif JP"', '"Yu Mincho"', '"YuMincho"', '"Hiragino Mincho ProN"', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* 縦書き設定 */
    .vertical-rl {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    
    .horizontal-tb {
      writing-mode: horizontal-tb;
      -webkit-writing-mode: horizontal-tb;
    }

    /* contenteditable プレースホルダー表示 */
    [contenteditable="true"]:empty:before {
      content: attr(data-placeholder);
      color: #a1a1aa;
      pointer-events: none;
      font-weight: normal;
    }

    /* 縦罫線（ガイド線） */
    .show-lines {
      background-image: repeating-linear-gradient(to left, rgba(203, 213, 225, 0.4) 0px, rgba(203, 213, 225, 0.4) 1px, transparent 1px, transparent 2.2em);
      background-position: right top;
    }

    /* スクロールバー非表示（編集感を損なわないため） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 印刷時のスタイル最適化 */
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }
      body {
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }
      .no-print {
        display: none !important;
      }
      .print-wrapper {
        padding: 0 !important;
        margin: 0 !important;
        background: none !important;
        width: 100vw !important;
        height: 100vh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .a4-paper {
        box-shadow: none !important;
        border: none !important;
        width: 297mm !important;
        height: 210mm !important;
        max-width: none !important;
        max-height: none !important;
        padding: 12mm 15mm !important;
        margin: 0 auto !important;
        page-break-after: always;
      }
      /* 印刷時はプレースホルダーを消す */
      [contenteditable="true"]:empty:before {
        content: "" !important;
      }
    }
  </style>

<body class="bg-slate-200 font-serif text-slate-800 min-h-screen flex flex-col antialiased selection:bg-slate-300">

  <!-- ================= TOOLBAR (NO-PRINT) ================= -->
  <header class="no-print bg-slate-900 text-slate-100 shadow-md sticky top-0 z-30 font-sans border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs">
      
      <!-- Title -->
      <div class="flex items-center gap-2">
        <span class="bg-slate-700 text-slate-200 px-2 py-0.5 rounded text-[11px] font-bold">国語</span>
        <h1 class="font-bold text-sm tracking-wide">縦書き資料作文ワークシート</h1>
      </div>

      <!-- Controls -->
      <div class="flex flex-wrap items-center gap-3">
        
        <!-- Layout Selection -->
        <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">
          <span class="text-slate-400 font-medium">配置:</span>
          <select id="layoutSelect" onchange="setLayout(this.value)" class="bg-slate-700 text-white rounded px-2 py-0.5 outline-none border border-slate-600 cursor-pointer">
            <option value="left1">左に資料 (1つ)</option>
            <option value="left2" selected="">左に資料 (2つ)</option>
            <option value="bottom2">下に資料 (2つ)</option>
            <option value="split">左右分割 (文章・資料・文章)</option>
          </select>
        </div>

        <!-- Font Size -->
        <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">
          <span class="text-slate-400 font-medium">文字:</span>
          <select id="fontSizeSelect" onchange="setFontSize(this.value)" class="bg-slate-700 text-white rounded px-2 py-0.5 outline-none border border-slate-600 cursor-pointer">
            <option value="sm">小 (14px)</option>
            <option value="md" selected="">中 (16px)</option>
            <option value="lg">大 (18px)</option>
          </select>
        </div>

        <!-- Grid Lines Toggle -->
        <label class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
          <input type="checkbox" id="linesToggle" onchange="toggleLines(this.checked)" checked="" class="rounded accent-emerald-500">
          <span class="text-slate-300">縦ガイド線</span>
        </label>

        <!-- Counter -->
        <div class="bg-slate-800 px-3 py-1 rounded border border-slate-700 font-mono text-slate-300">
          本文: <span id="charCount" class="font-bold text-emerald-400">0</span> 字
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2 ml-2">
          <button onclick="clearAll()" title="白紙に戻す" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1 rounded transition flex items-center gap-1">
            <span>🗑️</span> リセット
          </button>
          <button onclick="window.print()" title="A4横向き印刷・PDF保存" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-1 rounded shadow transition flex items-center gap-1">
            <span>🖨️</span> 印刷 / PDF
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ================= MAIN PAPER CONTAINER ================= -->
  <main class="flex-1 flex justify-center items-center p-4 sm:p-8 print-wrapper overflow-auto">
    
    <!-- A4 Landscape Sheet (Ratio: 297mm x 210mm) -->
    <div id="paper" class="a4-paper bg-white shadow-xl border border-slate-300 rounded-sm relative flex flex-col justify-between transition-all duration-200" style="width: 1000px; height: 707px; padding: 44px 50px;">
      
      <!-- DYNAMIC CONTENT LAYOUT -->
      <div id="paperContent" class="w-full h-full flex flex-row-reverse gap-6">
          <!-- 本文エリア（縦書き） -->
          <div class="flex-[3] flex vertical-rl show-lines leading-loose tracking-widest overflow-hidden" style="font-size: 16px;">
            <div class="outline-none font-bold text-center pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtTitle" data-placeholder="題名" oninput="onTextChange()"><br></div>
            <div class="outline-none text-right text-slate-700 pb-6 pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtAuthor" data-placeholder="〇年〇組 名前" oninput="onTextChange()"></div>
            <div class="outline-none flex-1 pl-2 h-full no-scrollbar" contenteditable="true" id="txtBody1" data-placeholder="ここから縦書きで文章を入力します…" oninput="onTextChange()"></div>
          </div>

          <!-- 資料エリア（左側 2つ上下） -->
          <div class="flex-[2] flex flex-col gap-4 horizontal-tb border-r border-slate-200 pr-6">
            <div class="flex-1 overflow-hidden">
        <div class="w-full h-full flex flex-col justify-between border border-slate-300 rounded p-2 bg-slate-50/50 relative group">
          
          <!-- Material Header (Title Input) -->
          <div class="mb-1 shrink-0 flex items-center">
            <input type="text" value="資料①" oninput="updateMaterialTitle(0, this.value)" placeholder="資料タイトル（例：資料①）" class="w-full bg-transparent font-bold text-xs text-slate-700 outline-none placeholder:text-slate-400 placeholder:font-normal">
          </div>

          <!-- Image Drop/Display Box -->
          <div onclick="triggerFileInput(0)" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 0)" class="flex-1 border-2 border-dashed border-slate-300 hover:border-slate-400 bg-white/70 rounded flex items-center justify-center overflow-hidden cursor-pointer relative transition">

                <p class="text-[10px] text-slate-400 mt-0.5">（Ctrl+V で貼り付けも可能）</p>
              </div>
            
          </div>

        </div>
      </div>

          <div class="mb-1 shrink-0 flex items-center">
            <input type="text" value="資料②" oninput="updateMaterialTitle(1, this.value)" placeholder="資料タイトル（例：資料①）" class="w-full bg-transparent font-bold text-xs text-slate-700 outline-none placeholder:text-slate-400 placeholder:font-normal">

                <div class="text-2xl text-slate-400 mb-1">📷</div>
                <p class="text-xs font-bold text-slate-500">クリックまたはドロップで画像を入れる</p>
                <p class="text-[10px] text-slate-400 mt-0.5">（Ctrl+V で貼り付けも可能）</p>
              </div>
            
          </div>

        </div>
      </div>
          </div>
        </div>

    </div>

  </main>

  <!-- Hidden File Input for Image Upload -->
  <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageFile(event)">


  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // State Management
    const state = {
      layout: 'left2', // 'left1', 'left2', 'bottom2', 'split'
      fontSize: 'md',  // 'sm', 'md', 'lg'
      showLines: true,
      title: '',
      author: '',
      body1: '',
      body2: '',
      materials: [
        { title: '資料①', image: '', fit: 'contain' },
        { title: '資料②', image: '', fit: 'contain' }
      ]
    };

    let activeMaterialIndex = null;

    // Font size pixel map
    const fontPxMap = {
      sm: '14px',
      md: '16px',
      lg: '18px'
    };

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      setupPasteListener();
      render();
    });

    // Main Render Function
    function render() {
      const paperContent = document.getElementById('paperContent');
      paperContent.innerHTML = '';

      const linesClass = state.showLines ? 'show-lines' : '';
      const fontPx = fontPxMap[state.fontSize] || '16px';

      // -------------------------------------------------------------
      // LAYOUT 1: LEFT 1 MATERIAL (右本文 + 左資料1つ)
      // -------------------------------------------------------------
      if (state.layout === 'left1') {
        paperContent.className = "w-full h-full flex flex-row-reverse gap-6";
        paperContent.innerHTML = `
          <!-- 本文エリア（縦書き） -->
          <div class="flex-[3] flex vertical-rl ${linesClass} leading-loose tracking-widest overflow-hidden" style="font-size: ${fontPx};">
            <div class="outline-none font-bold text-center pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtTitle" data-placeholder="題名" oninput="onTextChange()">${escapeHTML(state.title)}</div>
            <div class="outline-none text-right text-slate-700 pb-6 pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtAuthor" data-placeholder="〇年〇組 名前" oninput="onTextChange()">${escapeHTML(state.author)}</div>
            <div class="outline-none flex-1 pl-2 h-full no-scrollbar" contenteditable="true" id="txtBody1" data-placeholder="ここから縦書きで文章を入力します…" oninput="onTextChange()">${state.body1}</div>
          </div>

          <!-- 資料エリア（左側 1つ） -->
          <div class="flex-[2] flex flex-col justify-center horizontal-tb border-r border-slate-200 pr-6">
            ${renderMaterialSlot(0, 'h-full')}
          </div>
        `;
      }

      // -------------------------------------------------------------
      // LAYOUT 2: LEFT 2 MATERIALS (右本文 + 左資料2つ上下)
      // -------------------------------------------------------------
      else if (state.layout === 'left2') {
        paperContent.className = "w-full h-full flex flex-row-reverse gap-6";
        paperContent.innerHTML = `
          <!-- 本文エリア（縦書き） -->
          <div class="flex-[3] flex vertical-rl ${linesClass} leading-loose tracking-widest overflow-hidden" style="font-size: ${fontPx};">
            <div class="outline-none font-bold text-center pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtTitle" data-placeholder="題名" oninput="onTextChange()">${escapeHTML(state.title)}</div>
            <div class="outline-none text-right text-slate-700 pb-6 pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtAuthor" data-placeholder="〇年〇組 名前" oninput="onTextChange()">${escapeHTML(state.author)}</div>
            <div class="outline-none flex-1 pl-2 h-full no-scrollbar" contenteditable="true" id="txtBody1" data-placeholder="ここから縦書きで文章を入力します…" oninput="onTextChange()">${state.body1}</div>
          </div>

          <!-- 資料エリア（左側 2つ上下） -->
          <div class="flex-[2] flex flex-col gap-4 horizontal-tb border-r border-slate-200 pr-6">
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(0, 'h-full')}</div>
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(1, 'h-full')}</div>
          </div>
        `;
      }

      // -------------------------------------------------------------
      // LAYOUT 3: BOTTOM 2 MATERIALS (上本文 + 下資料2つ左右)
      // -------------------------------------------------------------
      else if (state.layout === 'bottom2') {
        paperContent.className = "w-full h-full flex flex-col justify-between gap-4";
        paperContent.innerHTML = `
          <!-- 本文エリア（縦書き） -->
          <div class="flex-1 flex vertical-rl ${linesClass} leading-loose tracking-widest overflow-hidden pb-2" style="font-size: ${fontPx};">
            <div class="outline-none font-bold text-center pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtTitle" data-placeholder="題名" oninput="onTextChange()">${escapeHTML(state.title)}</div>
            <div class="outline-none text-right text-slate-700 pb-6 pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtAuthor" data-placeholder="〇年〇組 名前" oninput="onTextChange()">${escapeHTML(state.author)}</div>
            <div class="outline-none flex-1 pl-2 h-full no-scrollbar" contenteditable="true" id="txtBody1" data-placeholder="ここから縦書きで文章を入力します…" oninput="onTextChange()">${state.body1}</div>
          </div>

          <!-- 資料エリア（下側 2つ左右） -->
          <div class="h-56 grid grid-cols-2 gap-4 horizontal-tb pt-3 border-t border-slate-200 shrink-0">
            ${renderMaterialSlot(0, 'h-full')}
            ${renderMaterialSlot(1, 'h-full')}
          </div>
        `;
      }

      // -------------------------------------------------------------
      // LAYOUT 4: SPLIT (右文章前半 + 中央資料 + 左文章後半)
      // -------------------------------------------------------------
      else if (state.layout === 'split') {
        paperContent.className = "w-full h-full flex flex-row-reverse gap-5";
        paperContent.innerHTML = `
          <!-- 右本文エリア（縦書き：前半） -->
          <div class="flex-[2] flex vertical-rl ${linesClass} leading-loose tracking-widest overflow-hidden" style="font-size: ${fontPx};">
            <div class="outline-none font-bold text-center pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtTitle" data-placeholder="題名" oninput="onTextChange()">${escapeHTML(state.title)}</div>
            <div class="outline-none text-right text-slate-700 pb-6 pl-3 border-l border-slate-200 shrink-0" contenteditable="true" id="txtAuthor" data-placeholder="〇年〇組 名前" oninput="onTextChange()">${escapeHTML(state.author)}</div>
            <div class="outline-none flex-1 pl-2 h-full no-scrollbar" contenteditable="true" id="txtBody1" data-placeholder="文章（前半）を入力…" oninput="onTextChange()">${state.body1}</div>
          </div>

          <!-- 中央資料エリア -->
          <div class="flex-[2] flex flex-col gap-3 horizontal-tb px-3 border-x border-slate-200">
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(0, 'h-full')}</div>
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(1, 'h-full')}</div>
          </div>

          <!-- 左本文エリア（縦書き：後半） -->
          <div class="flex-[2] flex vertical-rl ${linesClass} leading-loose tracking-widest overflow-hidden" style="font-size: ${fontPx};">
            <div class="outline-none flex-1 pl-2 h-full no-scrollbar" contenteditable="true" id="txtBody2" data-placeholder="文章（後半・まとめ）を入力…" oninput="onTextChange()">${state.body2}</div>
          </div>
        `;
      }

      updateCharCount();
    }

    // Material Slot HTML Generator
    function renderMaterialSlot(index, heightClass = '') {
      const mat = state.materials[index] || { title: `資料${index+1}`, image: '', fit: 'contain' };
      const hasImage = !!mat.image;

      return `
        <div class="w-full ${heightClass} flex flex-col justify-between border border-slate-300 rounded p-2 bg-slate-50/50 relative group">
          
          <!-- Material Header (Title Input) -->
          <div class="mb-1 shrink-0 flex items-center">
            <input type="text" value="${escapeHTML(mat.title)}" oninput="updateMaterialTitle(${index}, this.value)" 
              placeholder="資料タイトル（例：資料①）" 
              class="w-full bg-transparent font-bold text-xs text-slate-700 outline-none placeholder:text-slate-400 placeholder:font-normal">
          </div>

          <!-- Image Drop/Display Box -->
          <div 
            onclick="triggerFileInput(${index})"
            ondragover="handleDragOver(event)"
            ondrop="handleDrop(event, ${index})"
            class="flex-1 border-2 border-dashed ${hasImage ? 'border-transparent bg-white' : 'border-slate-300 hover:border-slate-400 bg-white/70'} rounded flex items-center justify-center overflow-hidden cursor-pointer relative transition"
          >
            ${hasImage ? `
              <img src="${mat.image}" class="w-full h-full object-${mat.fit} transition-all duration-150" alt="${escapeHTML(mat.title)}">
              
              <!-- Hover Overlay Controls (No-Print) -->
              <div class="no-print absolute top-1.5 right-1.5 opacity-0 group-hover:opacity-100 transition flex items-center gap-1 bg-slate-900/80 p-1 rounded backdrop-blur-sm z-10" onclick="event.stopPropagation()">
                <button onclick="toggleImageFit(${index})" title="表示切替 (全体 / 枠いっぱい)" class="text-white text-[10px] px-1.5 py-0.5 bg-slate-700 hover:bg-slate-600 rounded">
                  ${mat.fit === 'contain' ? '枠全体' : '全体表示'}
                </button>
                <button onclick="removeImage(${index})" title="画像を削除" class="text-red-300 hover:text-red-100 text-[10px] px-1.5 py-0.5 bg-red-900/60 hover:bg-red-800 rounded">
                  削除
                </button>
              </div>
            ` : `
              <div class="text-center p-3 select-none">
                <div class="text-2xl text-slate-400 mb-1">📷</div>
                <p class="text-xs font-bold text-slate-500">クリックまたはドロップで画像を入れる</p>
                <p class="text-[10px] text-slate-400 mt-0.5">（Ctrl+V で貼り付けも可能）</p>
              </div>
            `}
          </div>

        </div>
      `;
    }

    // Text Change Listener
    function onTextChange() {
      const elTitle = document.getElementById('txtTitle');
      const elAuthor = document.getElementById('txtAuthor');
      const elBody1 = document.getElementById('txtBody1');
      const elBody2 = document.getElementById('txtBody2');

      if (elTitle) state.title = elTitle.innerText;
      if (elAuthor) state.author = elAuthor.innerText;
      if (elBody1) state.body1 = elBody1.innerHTML;
      if (elBody2) state.body2 = elBody2.innerHTML;

      updateCharCount();
      saveState();
    }

    function updateCharCount() {
      const txt1 = document.getElementById('txtBody1')?.innerText || '';
      const txt2 = document.getElementById('txtBody2')?.innerText || '';
      const total = (txt1 + txt2).replace(/\s/g, '').length;
      document.getElementById('charCount').innerText = total;
    }

    // Material Operations
    function triggerFileInput(index) {
      activeMaterialIndex = index;
      document.getElementById('imageInput').click();
    }

    function handleImageFile(e) {
      const file = e.target.files[0];
      if (file && activeMaterialIndex !== null) {
        processImageFile(file, activeMaterialIndex);
      }
      e.target.value = '';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    function handleDrop(e, index) {
      e.preventDefault();
      e.stopPropagation();
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        processImageFile(files[0], index);
      }
    }

    function setupPasteListener() {
      window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
          if (item.type.indexOf('image') !== -1) {
            const file = item.getAsFile();
            // Default paste into first empty slot or slot 0
            let targetIdx = state.materials.findIndex(m => !m.image);
            if (targetIdx === -1) targetIdx = 0;
            processImageFile(file, targetIdx);
            break;
          }
        }
      });
    }

    function processImageFile(file, index) {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        state.materials[index].image = evt.target.result;
        saveState();
        render();
      };
      reader.readAsDataURL(file);
    }

    function updateMaterialTitle(index, val) {
      state.materials[index].title = val;
      saveState();
    }

    function toggleImageFit(index) {
      state.materials[index].fit = state.materials[index].fit === 'contain' ? 'cover' : 'contain';
      saveState();
      render();
    }

    function removeImage(index) {
      state.materials[index].image = '';
      saveState();
      render();
    }

    // Toolbar Operations
    function setLayout(val) {
      state.layout = val;
      saveState();
      render();
    }

    function setFontSize(val) {
      state.fontSize = val;
      saveState();
      render();
    }

    function toggleLines(checked) {
      state.showLines = checked;
      saveState();
      render();
    }

    function clearAll() {
      if (confirm('入力した文章と資料を消して、白紙に戻しますか？')) {
        state.title = '';
        state.author = '';
        state.body1 = '';
        state.body2 = '';
        state.materials = [
          { title: '資料①', image: '', fit: 'contain' },
          { title: '資料②', image: '', fit: 'contain' }
        ];
        saveState();
        render();
      }
    }

    // LocalStorage
    function saveState() {
      try {
        localStorage.setItem('tategaki_simple_sheet_state', JSON.stringify(state));
      } catch (err) {
        console.warn('LocalStorage save failed (image size might be too large):', err);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('tategaki_simple_sheet_state');
        if (saved) {
          const parsed = JSON.parse(saved);
          Object.assign(state, parsed);
          document.getElementById('layoutSelect').value = state.layout || 'left2';
          document.getElementById('fontSizeSelect').value = state.fontSize || 'md';
          document.getElementById('linesToggle').checked = state.showLines !== false;
        }
      } catch (err) {
        console.warn('LocalStorage load failed:', err);
      }
    }

    // Helper: Escape HTML
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>

</body></html>
