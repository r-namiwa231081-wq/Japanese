<!DOCTYPE html>
<html lang="ja" style="--font-size: 18px; --line-h: 36px;"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>縦書き資料作文ワークシート</title>
  
  <!-- Google Fonts: BIZ UDMincho, Noto Serif JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&amp;family=Noto+Serif+JP:wght@400;700&amp;display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* CSS変数：偶数pxで定義 */
    :root {
      --font-size: 18px;
      --line-h: 36px;
      --line-color: #cbd5e1;
    }

    body {
      font-family: "BIZ UDMincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      background-color: #1e293b;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* A4 横向き 用紙コンテナ */
    .sheet-paper {
      width: 1060px;
      height: 720px;
      background-color: #ffffff;
      padding: 32px 40px;
      box-sizing: border-box;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    /* 縦書きテキスト領域の単一基本スタイル */
    .v-text {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: upright;
      -webkit-text-orientation: upright;
      font-size: var(--font-size);
      line-height: var(--line-h) !important;
      font-feature-settings: "palt" 0;
      font-variant-east-asian: full-width;
      letter-spacing: 0 !important;
      word-break: break-all;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
      outline: none;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* contenteditable 内の改行用ブロック要素リセット */
    .v-text div,
    .v-text p {
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      font-size: inherit !important;
      line-height: var(--line-h) !important;
      font-family: inherit !important;
      letter-spacing: 0 !important;
    }

    /* 精密な縦罫線背景 */
    .grid-lines-on {
      background-image: repeating-linear-gradient(
        to left,
        transparent 0px,
        transparent calc(var(--line-h) - 1px),
        var(--line-color) calc(var(--line-h) - 1px),
        var(--line-color) var(--line-h)
      );
      background-position: right top;
      background-size: var(--line-h) 100%;
      background-attachment: local;
    }

    /* エディタ要素本体 */
    .v-editor {
      display: block;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      position: relative;
    }

    /* フォーカス時ハイライト */
    .v-editor:focus {
      outline: 2px solid #3b82f6;
      outline-offset: -1px;
    }

    /* プレースホルダー（入力なし時に表示） */
    .v-editor:empty::before {
      content: attr(data-placeholder);
      color: #94a3b8;
      pointer-events: none;
      display: block;
      font-weight: normal;
    }

    /* スクロールバー整形 */
    .v-editor::-webkit-scrollbar {
      height: 6px;
    }
    .v-editor::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 3px;
    }

    /* 印刷スタイル (@media print) */
    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }
      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-container {
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }
      .sheet-paper {
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .v-editor:focus {
        outline: none !important;
      }
      .v-editor:empty::before {
        display: none !important;
      }
      .empty-slot-print {
        border-color: transparent !important;
        background: transparent !important;
      }
      .print-hide-placeholder::placeholder {
        color: transparent !important;
      }
      .print-border-none {
        border: none !important;
      }
    }
  </style>

<body class="min-h-screen flex flex-col text-slate-800 antialiased">

  <!-- ================= 上部ツールバー (非印刷) ================= -->
  <header class="no-print bg-slate-900 text-slate-100 shadow-lg sticky top-0 z-50 font-sans text-xs border-b border-slate-700">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
      
      <!-- タイトル -->
      <div class="flex items-center gap-2">
        <span class="bg-emerald-600 text-white px-2 py-0.5 rounded font-bold text-[11px]">国語</span>
        <h1 class="font-bold text-sm tracking-wide">縦書き資料作文ワークシート</h1>
      </div>

      <!-- コントロール群 -->
      <div class="flex flex-wrap items-center gap-3">
        
        <!-- レイアウト切り替え -->
        <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">
          <span class="text-slate-400 font-medium">配置:</span>
          <select id="layoutSelect" onchange="setLayout(this.value)" class="bg-slate-700 text-white rounded px-2 py-0.5 outline-none border border-slate-600 cursor-pointer">
            <option value="left2" selected="">左に資料 (2つ)</option>
            <option value="left1">左に資料 (1つ)</option>
            <option value="bottom2">下に資料 (2つ)</option>
            <option value="split">左右分割 (文章/資料/文章)</option>
          </select>
        </div>

        <!-- 文字サイズ切り替え -->
        <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">
          <span class="text-slate-400 font-medium">文字サイズ:</span>
          <select id="fontSizeSelect" onchange="setFontSize(this.value)" class="bg-slate-700 text-white rounded px-2 py-0.5 outline-none border border-slate-600 cursor-pointer">
            <option value="sm">小 (16px/32px)</option>
            <option value="md" selected="">中 (18px/36px)</option>
            <option value="lg">大 (22px/44px)</option>
          </select>
        </div>

        <!-- 縦罫線 Toggle -->
        <label class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
          <input type="checkbox" id="linesToggle" onchange="toggleLines(this.checked)" checked="" class="rounded accent-emerald-500">
          <span class="text-slate-300">縦罫線</span>
        </label>

        <!-- 文字数カウンター -->
        <div class="bg-slate-800 px-3 py-1 rounded border border-slate-700 font-mono text-slate-300">
          本文 <span id="charCount" class="font-bold text-emerald-400">1</span> 字
        </div>

        <!-- ボタン群 -->
        <div class="flex items-center gap-2 ml-2">
          <button onclick="clearAll()" title="白紙に戻す" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1 rounded transition flex items-center gap-1">
            <span>🗑️</span> 全消去
          </button>
          <button onclick="window.print()" title="印刷・PDF保存" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-1 rounded shadow transition flex items-center gap-1">
            <span>🖨️</span> 印刷 / PDF
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ================= 用紙表示エリア ================= -->
  <main class="flex-1 flex justify-center items-center p-6 print-container overflow-auto">
    
    <!-- A4 横向き ワークシート本体 -->
    <div id="paperSheet" class="sheet-paper rounded-sm">
      <div id="paperContent" class="w-full h-full flex flex-row-reverse gap-6">
          <!-- 右側：縦書き文章エリア (横書きflex containerで右から左へ並べる) -->
          <div class="flex-1 h-full flex flex-row-reverse overflow-hidden">
            <!-- 題名欄 (1行固定) -->
            <div class="h-full shrink-0 relative" style="width: 36px;">
              <div id="txtTitle" contenteditable="true" data-placeholder="題名" class="v-text v-editor grid-lines-on text-center font-bold" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"><br></div>
            </div>
            <!-- 名前欄 (1行固定) -->
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: 36px;">
              <div id="txtAuthor" contenteditable="true" data-placeholder="年・名前" class="v-text v-editor grid-lines-on text-right text-slate-700" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <!-- 本文欄 -->
            <div class="h-full flex-1 relative overflow-hidden pl-2 body-box" onclick="focusEditor('txtBody1')">
              <div id="bodyBoxContainer1" class="w-full h-full">
                <div id="txtBody1" contenteditable="true" data-placeholder="ここに本文を入力…" class="v-text v-editor grid-lines-on" oninput="onTextChange()" onpaste="handlePaste(event)" style="width: 468px;">あ</div>
              </div>
            </div>
          </div>

          <!-- 左側：資料エリア (2段) -->
          <div class="w-2/5 h-full flex flex-col gap-4 border-r border-slate-200 pr-6">
            <div class="flex-1 overflow-hidden">
        <div onclick="selectMaterialSlot(0)" class="w-full h-full flex flex-col justify-between border border-slate-300 rounded p-2 bg-slate-50/50 relative group empty-slot-print">
          <!-- 1. 見出し入力 -->
          <div class="shrink-0 mb-1 border-b border-slate-200 pb-0.5">
            <input type="text" value="資料①" oninput="updateMaterialTitle(0, this.value)" placeholder="見出し（例：資料①）" class="w-full bg-transparent font-bold text-xs text-slate-700 outline-none print-hide-placeholder">
          </div>

          <!-- 2. 画像プレビュー / ドロップエリア -->
          <div onclick="triggerFileInput(0)" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 0)" class="flex-1 border border-dashed border-slate-300 hover:border-slate-400 bg-white/60 rounded flex items-center justify-center overflow-hidden cursor-pointer relative transition">
            
              <div class="text-center p-2 select-none print-hide-placeholder">
                <div class="text-xl text-slate-400 mb-0.5">📷</div>
                <p class="text-xs font-bold text-slate-500">画像を選択 / ドロップ</p>
                <p class="text-[10px] text-slate-400 mt-0.5">（Ctrl+V で貼付け可能）</p>
              </div>
            
          </div>

          <!-- 3. 出典・参考欄 -->
          <div class="mt-1 shrink-0 border-t border-slate-200/60 pt-0.5">
            <input type="text" value="" oninput="updateMaterialSource(0, this.value)" placeholder="出典・参考（例：環境省データより作成）" class="w-full bg-transparent text-[11px] text-slate-500 outline-none placeholder:text-slate-400 print-hide-placeholder">
          </div>
        </div>
      </div>
            <div class="flex-1 overflow-hidden">
        <div onclick="selectMaterialSlot(1)" class="w-full h-full flex flex-col justify-between border border-slate-300 rounded p-2 bg-slate-50/50 relative group empty-slot-print">
          <!-- 1. 見出し入力 -->
          <div class="shrink-0 mb-1 border-b border-slate-200 pb-0.5">
            <input type="text" value="資料②" oninput="updateMaterialTitle(1, this.value)" placeholder="見出し（例：資料①）" class="w-full bg-transparent font-bold text-xs text-slate-700 outline-none print-hide-placeholder">
          </div>

          <!-- 2. 画像プレビュー / ドロップエリア -->
          <div onclick="triggerFileInput(1)" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 1)" class="flex-1 border border-dashed border-slate-300 hover:border-slate-400 bg-white/60 rounded flex items-center justify-center overflow-hidden cursor-pointer relative transition">
            
              <div class="text-center p-2 select-none print-hide-placeholder">
                <div class="text-xl text-slate-400 mb-0.5">📷</div>
                <p class="text-xs font-bold text-slate-500">画像を選択 / ドロップ</p>
                <p class="text-[10px] text-slate-400 mt-0.5">（Ctrl+V で貼付け可能）</p>
              </div>
            
          </div>

          <!-- 3. 出典・参考欄 -->
          <div class="mt-1 shrink-0 border-t border-slate-200/60 pt-0.5">
            <input type="text" value="" oninput="updateMaterialSource(1, this.value)" placeholder="出典・参考（例：環境省データより作成）" class="w-full bg-transparent text-[11px] text-slate-500 outline-none placeholder:text-slate-400 print-hide-placeholder">
          </div>
        </div>
      </div>
          </div>
        </div>
    </div>

  </main>

  <!-- 非表示の画像ファイル入力 -->
  <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageFile(event)">

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // アプリケーション状態
    const state = {
      layout: 'left2',
      fontSize: 'md',
      showLines: true,
      title: '',
      author: '',
      body1: '',
      body2: '',
      materials: [
        { title: '資料①', image: '', source: '', fit: 'contain' },
        { title: '資料②', image: '', source: '', fit: 'contain' }
      ]
    };

    // 偶数ピクセル仕様（文字サイズ / 行高）
    const fontSpecs = {
      sm: { size: 16, line: 32 },
      md: { size: 18, line: 36 },
      lg: { size: 22, line: 44 }
    };

    let activeMaterialIndex = null;
    let selectedMaterialIndex = 0;
    let resizeObserver = null;

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      setupGlobalPaste();
      render();

      // 初回自動フォーカス
      setTimeout(() => {
        focusEditor('txtBody1');
      }, 200);
    });

    // CSS変数の更新
    function updateCSSVariables() {
      const spec = fontSpecs[state.fontSize] || fontSpecs.md;
      document.documentElement.style.setProperty('--font-size', `${spec.size}px`);
      document.documentElement.style.setProperty('--line-h', `${spec.line}px`);
    }

    // 全体レンダリング
    function render() {
      updateCSSVariables();
      if (resizeObserver) resizeObserver.disconnect();

      const container = document.getElementById('paperContent');
      container.innerHTML = '';
      const lineH = fontSpecs[state.fontSize].line;
      const lineClass = state.showLines ? 'grid-lines-on' : '';

      // 1. 左に資料 (2つ)
      if (state.layout === 'left2') {
        container.className = "w-full h-full flex flex-row-reverse gap-6";
        container.innerHTML = `
          <!-- 右側：縦書き文章エリア (横書きflex containerで右から左へ並べる) -->
          <div class="flex-1 h-full flex flex-row-reverse overflow-hidden">
            <!-- 題名欄 (1行固定) -->
            <div class="h-full shrink-0 relative" style="width: ${lineH}px;">
              <div id="txtTitle" contenteditable="true" data-placeholder="題名" class="v-text v-editor ${lineClass} text-center font-bold" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <!-- 名前欄 (1行固定) -->
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: ${lineH}px;">
              <div id="txtAuthor" contenteditable="true" data-placeholder="年・名前" class="v-text v-editor ${lineClass} text-right text-slate-700" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <!-- 本文欄 -->
            <div class="h-full flex-1 relative overflow-hidden pl-2 body-box" onclick="focusEditor('txtBody1')">
              <div id="bodyBoxContainer1" class="w-full h-full">
                <div id="txtBody1" contenteditable="true" data-placeholder="ここに本文を入力…" class="v-text v-editor ${lineClass}" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
              </div>
            </div>
          </div>

          <!-- 左側：資料エリア (2段) -->
          <div class="w-2/5 h-full flex flex-col gap-4 border-r border-slate-200 pr-6">
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(0)}</div>
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(1)}</div>
          </div>
        `;
      }
      
      // 2. 左に資料 (1つ)
      else if (state.layout === 'left1') {
        container.className = "w-full h-full flex flex-row-reverse gap-6";
        container.innerHTML = `
          <div class="flex-1 h-full flex flex-row-reverse overflow-hidden">
            <div class="h-full shrink-0 relative" style="width: ${lineH}px;">
              <div id="txtTitle" contenteditable="true" data-placeholder="題名" class="v-text v-editor ${lineClass} text-center font-bold" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: ${lineH}px;">
              <div id="txtAuthor" contenteditable="true" data-placeholder="年・名前" class="v-text v-editor ${lineClass} text-right text-slate-700" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <div class="h-full flex-1 relative overflow-hidden pl-2 body-box" onclick="focusEditor('txtBody1')">
              <div id="bodyBoxContainer1" class="w-full h-full">
                <div id="txtBody1" contenteditable="true" data-placeholder="ここに本文を入力…" class="v-text v-editor ${lineClass}" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
              </div>
            </div>
          </div>

          <div class="w-2/5 h-full flex flex-col border-r border-slate-200 pr-6">
            <div class="h-full overflow-hidden">${renderMaterialSlot(0)}</div>
          </div>
        `;
      }

      // 3. 下に資料 (2つ)
      else if (state.layout === 'bottom2') {
        container.className = "w-full h-full flex flex-col justify-between gap-4";
        container.innerHTML = `
          <div class="flex-1 w-full flex flex-row-reverse overflow-hidden pb-2">
            <div class="h-full shrink-0 relative" style="width: ${lineH}px;">
              <div id="txtTitle" contenteditable="true" data-placeholder="題名" class="v-text v-editor ${lineClass} text-center font-bold" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: ${lineH}px;">
              <div id="txtAuthor" contenteditable="true" data-placeholder="年・名前" class="v-text v-editor ${lineClass} text-right text-slate-700" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <div class="h-full flex-1 relative overflow-hidden pl-2 body-box" onclick="focusEditor('txtBody1')">
              <div id="bodyBoxContainer1" class="w-full h-full">
                <div id="txtBody1" contenteditable="true" data-placeholder="ここに本文を入力…" class="v-text v-editor ${lineClass}" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
              </div>
            </div>
          </div>

          <div class="h-56 grid grid-cols-2 gap-4 pt-3 border-t border-slate-200 shrink-0">
            ${renderMaterialSlot(0)}
            ${renderMaterialSlot(1)}
          </div>
        `;
      }

      // 4. 左右分割 (文章 / 資料 / 文章)
      else if (state.layout === 'split') {
        container.className = "w-full h-full flex flex-row-reverse gap-4";
        container.innerHTML = `
          <!-- 右側：文章前半 -->
          <div class="flex-1 h-full flex flex-row-reverse overflow-hidden">
            <div class="h-full shrink-0 relative" style="width: ${lineH}px;">
              <div id="txtTitle" contenteditable="true" data-placeholder="題名" class="v-text v-editor ${lineClass} text-center font-bold" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <div class="h-full shrink-0 relative border-l border-slate-200" style="width: ${lineH}px;">
              <div id="txtAuthor" contenteditable="true" data-placeholder="年・名前" class="v-text v-editor ${lineClass} text-right text-slate-700" onkeydown="handleSingleLineKeydown(event)" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
            </div>
            <div class="h-full flex-1 relative overflow-hidden pl-2 body-box" onclick="focusEditor('txtBody1')">
              <div id="bodyBoxContainer1" class="w-full h-full">
                <div id="txtBody1" contenteditable="true" data-placeholder="文章（前半）を入力…" class="v-text v-editor ${lineClass}" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
              </div>
            </div>
          </div>

          <!-- 中央：資料2つ -->
          <div class="w-1/3 h-full flex flex-col gap-3 px-3 border-x border-slate-200">
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(0)}</div>
            <div class="flex-1 overflow-hidden">${renderMaterialSlot(1)}</div>
          </div>

          <!-- 左側：文章後半 -->
          <div class="flex-1 h-full flex flex-row-reverse overflow-hidden">
            <div class="h-full flex-1 relative overflow-hidden pl-2 body-box" onclick="focusEditor('txtBody2')">
              <div id="bodyBoxContainer2" class="w-full h-full">
                <div id="txtBody2" contenteditable="true" data-placeholder="文章（後半）を入力…" class="v-text v-editor ${lineClass}" oninput="onTextChange()" onpaste="handlePaste(event)"></div>
              </div>
            </div>
          </div>
        `;
      }

      restoreTextValues();
      setupResizeObserver();
      updateCharCount();
    }

    // ResizeObserver で本文幅を行高(--line-h)の整数倍にスナップ
    function setupResizeObserver() {
      const lineH = fontSpecs[state.fontSize].line;
      resizeObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
          const parentWidth = entry.contentRect.width;
          if (parentWidth > 0) {
            const snappedWidth = Math.floor(parentWidth / lineH) * lineH;
            const editor = entry.target.querySelector('.v-editor');
            if (editor && snappedWidth > 0) {
              editor.style.width = `${snappedWidth}px`;
            }
          }
        }
      });

      const c1 = document.getElementById('bodyBoxContainer1');
      if (c1) resizeObserver.observe(c1);
      const c2 = document.getElementById('bodyBoxContainer2');
      if (c2) resizeObserver.observe(c2);
    }

    // フォーカス補助
    function focusEditor(id) {
      const el = document.getElementById(id);
      if (el) {
        el.focus();
      }
    }

    // 資料スロット用コンポーネント生成
    function renderMaterialSlot(index) {
      const mat = state.materials[index] || { title: `資料${index === 0 ? '①' : '②'}`, image: '', source: '', fit: 'contain' };
      const hasImage = !!mat.image;
      const objectFitClass = mat.fit === 'cover' ? 'object-cover' : 'object-contain';

      return `
        <div 
          onclick="selectMaterialSlot(${index})"
          class="w-full h-full flex flex-col justify-between border border-slate-300 rounded p-2 bg-slate-50/50 relative group ${!hasImage ? 'empty-slot-print' : 'print-border-none'}"
        >
          <!-- 1. 見出し入力 -->
          <div class="shrink-0 mb-1 border-b border-slate-200 pb-0.5">
            <input 
              type="text" 
              value="${escapeHTML(mat.title)}" 
              oninput="updateMaterialTitle(${index}, this.value)" 
              placeholder="見出し（例：資料①）" 
              class="w-full bg-transparent font-bold text-xs text-slate-700 outline-none print-hide-placeholder"
            >
          </div>

          <!-- 2. 画像プレビュー / ドロップエリア -->
          <div 
            onclick="triggerFileInput(${index})"
            ondragover="handleDragOver(event)"
            ondrop="handleDrop(event, ${index})"
            class="flex-1 border border-dashed ${hasImage ? 'border-transparent bg-white' : 'border-slate-300 hover:border-slate-400 bg-white/60'} rounded flex items-center justify-center overflow-hidden cursor-pointer relative transition"
          >
            ${hasImage ? `
              <img src="${mat.image}" class="w-full h-full ${objectFitClass}" alt="${escapeHTML(mat.title)}">
              <div class="no-print absolute top-1.5 right-1.5 opacity-0 group-hover:opacity-100 transition flex items-center gap-1 bg-slate-900/80 p-1 rounded-lg z-10">
                <button 
                  onclick="event.stopPropagation(); toggleImageFit(${index})" 
                  title="全体表示 / 枠いっぱい 切り替え" 
                  class="text-white text-[10px] bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded font-sans"
                >
                  ${mat.fit === 'cover' ? '全体' : '拡大'}
                </button>
                <button 
                  onclick="event.stopPropagation(); removeImage(${index})" 
                  title="画像を削除" 
                  class="text-white text-[10px] bg-red-600 hover:bg-red-500 px-1.5 py-0.5 rounded font-sans font-bold"
                >
                  ✕
                </button>
              </div>
            ` : `
              <div class="text-center p-2 select-none print-hide-placeholder">
                <div class="text-xl text-slate-400 mb-0.5">📷</div>
                <p class="text-xs font-bold text-slate-500">画像を選択 / ドロップ</p>
                <p class="text-[10px] text-slate-400 mt-0.5">（Ctrl+V で貼付け可能）</p>
              </div>
            `}
          </div>

          <!-- 3. 出典・参考欄 -->
          <div class="mt-1 shrink-0 border-t border-slate-200/60 pt-0.5">
            <input 
              type="text" 
              value="${escapeHTML(mat.source)}" 
              oninput="updateMaterialSource(${index}, this.value)" 
              placeholder="出典・参考（例：環境省データより作成）" 
              class="w-full bg-transparent text-[11px] text-slate-500 outline-none placeholder:text-slate-400 print-hide-placeholder"
            >
          </div>
        </div>
      `;
    }

    // 1行固定欄の Enter 改行制御
    function handleSingleLineKeydown(e) {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
      }
    }

    // ペースト処理（プレーンテキスト化）
    function handlePaste(e) {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
      onTextChange();
    }

    // 入力テキスト同期
    function onTextChange() {
      const elTitle = document.getElementById('txtTitle');
      const elAuthor = document.getElementById('txtAuthor');
      const elBody1 = document.getElementById('txtBody1');
      const elBody2 = document.getElementById('txtBody2');

      if (elTitle) state.title = elTitle.innerText;
      if (elAuthor) state.author = elAuthor.innerText;
      if (elBody1) state.body1 = elBody1.innerText;
      if (elBody2) state.body2 = elBody2.innerText;

      updateCharCount();
      saveState();
    }

    function restoreTextValues() {
      const elTitle = document.getElementById('txtTitle');
      const elAuthor = document.getElementById('txtAuthor');
      const elBody1 = document.getElementById('txtBody1');
      const elBody2 = document.getElementById('txtBody2');

      if (elTitle && state.title) elTitle.innerText = state.title;
      if (elAuthor && state.author) elAuthor.innerText = state.author;
      if (elBody1 && state.body1) elBody1.innerText = state.body1;
      if (elBody2 && state.body2) elBody2.innerText = state.body2;
    }

    function updateCharCount() {
      const count1 = (state.body1 || '').replace(/\s/g, '').length;
      const count2 = (state.body2 || '').replace(/\s/g, '').length;
      const total = count1 + count2;
      const el = document.getElementById('charCount');
      if (el) el.innerText = total;
    }

    // 画像操作・ファイル取り込み
    function selectMaterialSlot(index) {
      selectedMaterialIndex = index;
    }

    function triggerFileInput(index) {
      activeMaterialIndex = index;
      selectedMaterialIndex = index;
      document.getElementById('imageInput').click();
    }

    function handleImageFile(e) {
      const file = e.target.files[0];
      if (file && activeMaterialIndex !== null) {
        processImageFile(file, activeMaterialIndex);
      }
      e.target.value = '';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    function handleDrop(e, index) {
      e.preventDefault();
      e.stopPropagation();
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        processImageFile(files[0], index);
      }
    }

    function setupGlobalPaste() {
      window.addEventListener('paste', (e) => {
        if (document.activeElement && document.activeElement.getAttribute('contenteditable') === 'true') {
          return;
        }
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
          if (item.type.indexOf('image') !== -1) {
            const file = item.getAsFile();
            processImageFile(file, selectedMaterialIndex);
            break;
          }
        }
      });
    }

    function processImageFile(file, index) {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        state.materials[index].image = evt.target.result;
        saveState();
        render();
      };
      reader.readAsDataURL(file);
    }

    function toggleImageFit(index) {
      const current = state.materials[index].fit || 'contain';
      state.materials[index].fit = current === 'contain' ? 'cover' : 'contain';
      saveState();
      render();
    }

    function updateMaterialTitle(index, val) {
      state.materials[index].title = val;
      saveState();
    }

    function updateMaterialSource(index, val) {
      state.materials[index].source = val;
      saveState();
    }

    function removeImage(index) {
      state.materials[index].image = '';
      saveState();
      render();
    }

    // 設定変更
    function setLayout(val) {
      state.layout = val;
      saveState();
      render();
    }

    function setFontSize(val) {
      state.fontSize = val;
      saveState();
      render();
    }

    function toggleLines(checked) {
      state.showLines = checked;
      saveState();
      render();
    }

    function clearAll() {
      if (confirm('すべての文章と画像をクリアして白紙に戻しますか？')) {
        state.title = '';
        state.author = '';
        state.body1 = '';
        state.body2 = '';
        state.materials = [
          { title: '資料①', image: '', source: '', fit: 'contain' },
          { title: '資料②', image: '', source: '', fit: 'contain' }
        ];
        saveState();
        render();
      }
    }

    // ストレージ保存
    function saveState() {
      try {
        localStorage.setItem('tategaki_sheet_v4', JSON.stringify(state));
      } catch (err) {
        console.warn('LocalStorage save failed:', err);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('tategaki_sheet_v4');
        if (saved) {
          const parsed = JSON.parse(saved);
          Object.assign(state, parsed);
          const elL = document.getElementById('layoutSelect');
          const elF = document.getElementById('fontSizeSelect');
          const elT = document.getElementById('linesToggle');
          if (elL) elL.value = state.layout || 'left2';
          if (elF) elF.value = state.fontSize || 'md';
          if (elT) elT.checked = state.showLines !== false;
        }
      } catch (err) {
        console.warn('LocalStorage load failed:', err);
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
